<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komgarr</title>
  <link rel="stylesheet" href="/dist/styles.css">
  <style>
    /* Fallback styles - ensures visibility even without compiled Tailwind */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: #1a1d23;
      color: #e5e7eb;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-size: 1.25rem;
    }
    /* Ensure text is always visible */
    h1, h2, h3, p, span, div, label { color: inherit; }
    aside { background: #242830; }
    aside h1 { color: #3b82f6; }
    aside a span { color: #9ca3af; }
    aside a.active span { color: white; }
    main h2 { color: #e5e7eb; font-size: 1.5rem; font-weight: bold; }
    .card { background: #242830; border: 1px solid #3d4350; border-radius: 0.5rem; padding: 1rem; }
    input { background: #2d323c; border: 1px solid #3d4350; color: #e5e7eb; padding: 0.5rem; border-radius: 0.5rem; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Loading Komgarr...</div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
