services:
  web:
    build:
      context: .
      target: web
    container_name: shelvarr
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # Add your library mounts here:
      # - /path/to/ebooks:/libraries/ebooks:rw
      # - /path/to/comics:/libraries/comics:rw
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - LIBRARY_ROOT=/libraries
      # Optional: Komga integration
      # - KOMGA_URL=http://your-komga:25600
      # - KOMGA_API_KEY=your-api-key
      # User accounts. On by default; the first visit runs a setup wizard.
      # Set the public URL so emailed sign-in links point somewhere reachable.
      # - SHELVARR_URL=http://shelvarr.local:3000
      # Set false to turn accounts off and leave the server open.
      # - SHELVARR_AUTH_ENABLED=false
      # - SHELVARR_ALLOW_SIGNUP=false
      # Without SMTP, sign-in links are written to the container log instead.
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=shelvarr@example.com
      # - SMTP_PASSWORD=your-password
      # - SMTP_FROM=Shelvarr <shelvarr@example.com>
      # Comic sourcing from GetComics
      - COMIC_LIBRARY_ROOT=/libraries/comics
      # - GETCOMICS_HOST_PREFERENCE=getcomics,pixeldrain
      # Only while migrating a library another tool organised
      # - COMIC_PATH_MAP=/comics-1:/libraries/comics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
