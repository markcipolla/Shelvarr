version: '3.8'

# Test database for running integration tests
# Usage: docker-compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: shelvarr-postgres-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=shelvarr_test
      - POSTGRES_PASSWORD=shelvarr_test
      - POSTGRES_DB=shelvarr_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelvarr_test -d shelvarr_test"]
      interval: 2s
      timeout: 5s
      retries: 10
