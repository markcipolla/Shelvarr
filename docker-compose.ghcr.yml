# Example docker-compose for pulling pre-built images from ghcr.io
# Usage: docker-compose -f docker-compose.ghcr.yml up -d

services:
  web:
    image: ghcr.io/YOUR_USERNAME/shelvarr-web:latest
    container_name: shelvarr
    ports:
      - "3000:3000"
    volumes:
      - shelvarr_data:/app/data
      # Mount your book libraries here:
      - /path/to/ebooks:/libraries/ebooks:rw
      - /path/to/comics:/libraries/comics:rw
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - LIBRARY_ROOT=/libraries
      # User accounts. On by default; the first visit runs a setup wizard.
      # Everything below is read from the environment, or from a .env file
      # sitting next to this one. Unset is the same as absent — each falls
      # back to the default documented in the README, so leave them out of
      # .env rather than setting them empty to mean something.
      # Set false to turn accounts off and leave the server open.
      - SHELVARR_AUTH_ENABLED=${SHELVARR_AUTH_ENABLED:-}
      - SHELVARR_ALLOW_SIGNUP=${SHELVARR_ALLOW_SIGNUP:-}
      # Without SMTP_HOST, sign-in codes are written to the container log.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  shelvarr_data:
