name: CI (self-hosted)

# The same suite as ci.yml, on the org's self-hosted runners, for fast feedback
# on branches pushed to this repository.
#
# The security boundary is the trigger, not anything written below. Forks
# cannot raise a `push` event on this repository — a fork's own pushes run in
# the fork's Actions context, which has no line of sight to our runners — and
# `workflow_dispatch` needs write access. So fork code can never reach this
# workflow, no matter what a pull request does to the file. That is the whole
# reason the pull-request gate lives in a separate, GitHub-hosted workflow
# instead of this one growing a `runs-on` expression.
#
# Reaching the runners also needs a runner group with `allows_public_repositories`
# enabled and this repository selected. See docs/self-hosted-ci.md.
#
# Job IDs deliberately differ from ci.yml's. A branch with an open pull request
# runs both workflows against the same SHA, and matching IDs would make two
# runs fight over one status-check context — and would let this workflow
# satisfy the ruleset's required checks, which must stay fork-safe.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck-self-hosted:
    name: lint-and-typecheck (self-hosted)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @shelvarr/web lint

      - name: Type check
        run: pnpm --filter @shelvarr/web typecheck

  test-self-hosted:
    name: test (self-hosted)
    runs-on: self-hosted
    env:
      HARDCOVER_API_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @shelvarr/web test

  e2e-self-hosted:
    name: e2e (self-hosted)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @shelvarr/web build

      - name: Free up disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h || true
          # A self-hosted runner can be tight on disk, so reclaim what we can
          # before pulling the browser and its libraries.
          # The E2E tests run `next dev` (see playwright.config webServer), so the
          # production build output created above is dead weight here.
          rm -rf apps/web/.next || true
          # Clear apt caches/indexes. Containerised runners tend to run as
          # root with no `sudo` installed; VM-based ones need it.
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          $SUDO apt-get clean || true
          $SUDO rm -rf /var/lib/apt/lists/* || true
          # Drop unreferenced packages and stale tool caches.
          pnpm store prune || true
          npm cache clean --force || true
          # The Playwright browser cache is deliberately left alone. Clearing it
          # frees ~150MB and then immediately spends it again on the re-download
          # below — which is the worst thing to do on a runner with no room.
          # Keeping it lets the install step no-op instead.
          echo "Disk usage after cleanup:"
          df -h || true

      - name: Install Playwright system libraries
        # `playwright install --with-deps` pulls ~650MB (fonts, xvfb, mesa, an
        # X server), which we do not want to re-download on every run and which
        # may not fit. The headless Chromium shell only needs this handful of
        # shared libraries, and --no-install-recommends keeps the footprint
        # minimal.
        #
        # They persist between runs on a self-hosted runner, so a run that needs
        # nothing installed skips apt entirely. That also keeps a full disk from
        # failing the job for no reason: apt cannot write its indexes with no
        # space and reports it as "At least one invalid signature was
        # encountered", which then makes every package "unable to locate".
        run: |
          set -euo pipefail

          if (ldconfig -p 2>/dev/null || /sbin/ldconfig -p 2>/dev/null) | grep -q 'libnss3\.so'; then
            echo "Browser libraries already present; skipping apt."
            exit 0
          fi

          # Containerised runners often run as root with no `sudo` installed,
          # while VM-based ones need it. Pick whichever applies.
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "::error::This runner is neither root nor has sudo, so the browser libraries cannot be installed. Bake them into the runner image instead."
            exit 1
          fi

          available=$(df --output=avail -k / | tail -1)
          if [ "$available" -lt 1048576 ]; then
            echo "::error::Runner has under 1GB free on /, so apt cannot install the browser libraries. Reclaim space on the runner host."
            df -h
            exit 1
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxext6 libxcb1 libx11-6 \
            libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0

      - name: Install Playwright browser
        # A no-op when the cached browser already matches the pinned version,
        # which is why the cleanup step above does not delete it.
        run: npx playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @shelvarr/web test:e2e
