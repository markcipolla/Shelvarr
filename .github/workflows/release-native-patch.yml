name: Release Native App (patch)

# Cuts a patch release of the Android app whenever master goes green with app
# changes in it, so a merged fix reaches phones without anyone remembering to
# tag it. Major and minor releases stay manual: bump `expo.version` in
# apps/native/app.json, or push the tag yourself. See apps/native/RELEASING.md.
#
# Follows "CI (self-hosted)" rather than the push itself, for the same reason
# docker-publish.yml does: CI only runs on pull requests, so a push to master
# produces no "CI" run to key off, and a red master should not ship an APK.
# The decision about whether this push is worth a release — and which version it
# would be — lives in apps/native/scripts/next-release.mjs.

on:
  workflow_run:
    workflows: ["CI (self-hosted)"]
    branches: [main, master]
    types:
      - completed
  workflow_dispatch:

# One release at a time. Two merges landing together would otherwise race to
# claim the same patch number, and the loser's `git push` would fail.
concurrency:
  group: release-native
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history and every tag: the next version, and whether there
          # is anything to release at all, are both read off the last tag.
          fetch-depth: 0

      - name: Work out the next version
        id: next
        run: node apps/native/scripts/next-release.mjs >> "$GITHUB_OUTPUT"

      - name: Tag the release
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  build-apk:
    needs: tag
    if: needs.tag.outputs.tag != ''
    # Called rather than triggered: a tag pushed with GITHUB_TOKEN raises no
    # `push` event, so the tag above would never start the release build.
    uses: ./.github/workflows/release-native.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
