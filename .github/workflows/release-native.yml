name: Release Native App

# Builds a signed Android APK for a version tag and attaches it to the GitHub
# release. The native app polls that release to offer itself an update, so the
# asset must be named `*.apk` and signed with a stable key — see
# apps/native/plugins/withReleaseSigning.js.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the release keystore is configured
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Releases must be signed with a stable key or Android will refuse to install them over an existing build. See apps/native/RELEASING.md."
            exit 1
          fi

      - name: Match the tag to the app version
        run: node apps/native/scripts/prepare-release.mjs "${GITHUB_REF_NAME}"

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Generate the Android project
        working-directory: apps/native
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/native/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Shown in the app's Settings screen so a build can be traced back.
          EXPO_PUBLIC_BUILD_VERSION: ${{ github.sha }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after the release
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=apps/native/android/app/build/outputs/apk/release/app-release.apk
          DEST="$RUNNER_TEMP/shelvarr-$VERSION.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # The tag may have been pushed without a release; create one if so.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
