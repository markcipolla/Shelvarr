name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @shelvarr/web lint

      - name: Type check
        run: pnpm --filter @shelvarr/web typecheck

  test:
    runs-on: self-hosted
    env:
      HARDCOVER_API_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @shelvarr/web test

  e2e:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @shelvarr/web build

      - name: Free up disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h || true
          # The E2E tests run `next dev` (see playwright.config webServer), so the
          # production build output created above is dead weight here.
          rm -rf apps/web/.next || true
          # Clear apt caches/indexes (the bulk of what `--with-deps` will fetch).
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          # These paths only exist on GitHub-hosted runners; harmless if absent.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          # Drop unreferenced packages and stale tool caches.
          pnpm store prune || true
          npm cache clean --force || true
          echo "Disk usage after cleanup:"
          df -h || true

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @shelvarr/web test:e2e
