name: CI

# The fork-facing half of CI, and the gate the `Shelvarr rules` ruleset
# requires. Shelvarr is public, and a `pull_request` run executes the workflow
# file from the *fork's* head — so a fork can rewrite anything in this file,
# including `runs-on`. That makes GitHub-hosted runners the only safe choice
# here, and it is why routing forks away with a `runs-on` expression would be
# theatre rather than a boundary. Self-hosted runs live in ci-self-hosted.yml,
# behind a trigger forks cannot reach.
#
# Job IDs are load-bearing: the ruleset's required status checks match them by
# name. Renaming one silently stops gating merges.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @shelvarr/web lint

      - name: Type check
        run: pnpm --filter @shelvarr/web typecheck

  test:
    runs-on: ubuntu-latest
    env:
      HARDCOVER_API_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @shelvarr/web test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the exact Playwright version, because a browser build is only
      # valid for the version that pinned it. An exact-match key with no
      # `restore-keys` is the point: a stale browser is worse than a download.
      - name: Resolve Playwright version
        id: playwright
        run: |
          set -euo pipefail
          # `pnpm exec` can prepend warnings, so pick the version line rather
          # than trusting that the output is one line long. A multi-line value
          # would corrupt $GITHUB_OUTPUT.
          version=$(pnpm --filter @shelvarr/web exec playwright --version \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        # A no-op for the browser itself on a cache hit; `--with-deps` still
        # runs apt, which is not cacheable and has to happen either way.
        run: npx playwright install --with-deps chromium

      # `test:e2e` is `next build && playwright test`. There is deliberately no
      # separate build step: a second `next build` here is a full rebuild, not
      # an incremental one, so having both cost ~17s to produce output the test
      # command threw away.
      - name: Run E2E tests
        run: pnpm --filter @shelvarr/web test:e2e
