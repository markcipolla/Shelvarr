name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @shelvarr/web lint

      - name: Type check
        run: pnpm --filter @shelvarr/web typecheck

  test:
    runs-on: self-hosted
    env:
      HARDCOVER_API_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @shelvarr/web test

  e2e:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @shelvarr/web build

      - name: Free up disk space
        run: |
          # This is a persistent self-hosted runner, so reclaim space that
          # accumulates between runs before downloading the browser.
          sudo apt-get clean || true
          pnpm store prune || true
          # Drop stale Playwright browser builds; the version we need is
          # re-downloaded in the next step.
          rm -rf ~/.cache/ms-playwright || true
          df -h || true

      - name: Install Playwright browsers
        # No --with-deps: the OS-level libraries are provisioned once on the
        # self-hosted runner. Re-installing them every run apt-fetches ~650MB
        # and fills the runner's disk.
        run: npx playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter @shelvarr/web test:e2e
