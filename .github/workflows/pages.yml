name: Pages

# Publishes site/ to GitHub Pages. The page borrows its screenshots and logo
# from docs/ — the same files the README shows — through symlinks, which the
# copy below resolves.
#
# Push-only, like the Docker publish: nothing a fork's pull request can reach.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'docs/logo.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let an in-progress one finish rather than cutting
# it off half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: cp -RL site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
